### Interfaces

interface Card {
  id: ID!
  name: String!
  cost: Int!
  inkwell: Boolean!
  ink: Ink!
  classifications: [Classification!]!
  rarity: Rarity!
  set: Int!
  number: Int!
}

### Types

type Character implements Card {
  id: ID!
  name: String!
  cost: Int!
  inkwell: Boolean!
  ink: Ink!
  classifications: [Classification!]!
  rarity: Rarity!
  set: Int!
  number: Int!

  version: String! # Version / Variant / Title
  strength: Int!
  willpower: Int!
  loreValue: Int!
  abilities: [Ability!]
}

type Action implements Card {
  id: ID!
  name: String!
  cost: Int!
  inkwell: Boolean!
  ink: Ink!
  classifications: [Classification!]!
  rarity: Rarity!
  set: Int!
  number: Int!

  description: String!
  singTogetherCost: Int
}

type Location implements Card {
  id: ID!
  name: String!
  cost: Int!
  inkwell: Boolean!
  ink: Ink!
  classifications: [Classification!]!
  rarity: Rarity!
  set: Int!
  number: Int!

  willpower: Int!
  loreValue: Int!
  moveCost: Int!
  abilities: [Ability!]
}

type Ability {
  id: ID!
  name: String!
  description: String!
  keyword: Boolean! # True for common abilities such as Bodyguard, Reckless, Evasive, etc.
}


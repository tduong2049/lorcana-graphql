### Queries

type Query {
  cards(filter: CardsFilter): [Card!]!
  characters(filter: CharactersFilter): [Character!]!
  actions(filter: ActionsFilter): [Action!]!
  locations(filter: LocationsFilter): [Location!]!
}

### Query Inputs

input CardsFilter {
  ids: [ID!]
  names: [String!]
  costs: [Int!]
  inkwell: Boolean
  inks: [Ink!]
  classifications: [Classification!]
  rarities: [Rarity!]
  sets: [Int!]
}

input CharactersFilter {
  ids: [ID!]
  names: [String!]
  costs: [Int!]
  inkwell: Boolean
  inks: [Ink!]
  classifications: [Classification!]
  rarities: [Rarity!]
  sets: [Int!]

  versions: [String!]
  strengths: [Int!]
  willpower: [Int!]
  loreValues: [Int!]
  abilities: AbilitiesFilter
}

input ActionsFilter {
  ids: [ID!]
  names: [String!]
  costs: [Int!]
  inkwell: Boolean
  inks: [Ink!]
  classifications: [Classification!]
  rarities: [Rarity!]
  sets: [Int!]

  descriptions: [String!]
  singTogetherCosts: [Int!]
}

input LocationsFilter {
  ids: [ID!]
  names: [String!]
  costs: [Int!]
  inkwell: Boolean
  inks: [Ink!]
  classifications: [Classification!]
  rarities: [Rarity!]
  sets: [Int!]

  willpower: [Int!]
  loreValues: [Int!]
  moveCosts: [Int!]
  abilities: AbilitiesFilter
}

input AbilitiesFilter {
  ids: [ID!]
  names: [String!]
  descriptions: [String!]
  keyword: Boolean
}

